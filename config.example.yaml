# AugLoop Copilot Proxy v2 - Configuration Template
# Copy this file to config.yaml and fill in your details
# Most fields will be automatically populated on first run

server:
  host: 127.0.0.1
  port: 8080
  api_key: ''             # Leave empty for no authentication; if set, all requests require Authorization: Bearer <key>

augloop:
  base_url: https://augloop.svc.cloud.microsoft
  workflow: OfficeCopilotOrchestrationWorkflow
  bearer_token: ''        # JWE Token (automatically acquired, no manual entry needed)
  auth_token: ''          # JWT Token (automatically acquired, no manual entry needed)
  x_client_metadata: ''   # Client metadata (automatically acquired, includes flights config)
  x_office_session_id: '' # Office session ID (automatically generated)
  copilot_license_type: ConsumerPro
  proxy_url: ''           # Proxy server URL (if access to AugLoop requires an upstream proxy)
  strip_prompts: true     # Strip Copilot wrapper from system prompts
  chat:
    message_field: promptText
    output_type: AugLoop_OfficeCopilotOrchestration_CopilotChatResponse
    prompt_type: UserPrompt
    response_field: response
    signal_base:
    - AugLoop_Signals_Signal
    signal_type: AugLoop_OfficeCopilotOrchestration_CopilotChatSignal
  chat_fallback_prompt_types:
  - UserPrompt
  - Chat
  - ConversationMessage
  - Prompt
  prompts:
    output_type: AugLoop_OfficeCopilotOrchestration_CopilotPrompts
    prompt_type: DynamicActionButton
    signal_base:
    - AugLoop_Signals_Signal
    signal_type: AugLoop_OfficeCopilotOrchestration_CopilotPromptsSignal

conversation:
  db_path: conversations.db
  max_messages: 1000

graph_api:
  base_url: https://graph.microsoft.com
  bearer_token: ''        # Graph API Token (optional, used for Copilot Uploads feature)
  copilot_uploads_path: /v1.0/me/drive/special/copilotuploads

token_manager:
  auto_refresh: true
  refresh_interval: 120              # Check interval (seconds), checks token status every 2 minutes
  preemptive_refresh_threshold: 600  # Preemptive refresh threshold (seconds), proactively refreshes when remaining time is less than this
  strategies:                        # Token acquisition strategy priority (tried from top to bottom)
  - auto     # Memory scan Excel process (requires Excel running, recommended)
  - wam      # Silent acquisition via MSAL.NET broker
  - har      # Extract from HAR file
  - mitm     # Read from .augloop_token file
  - frida    # Frida memory scan (requires frida installed)

tools:
  enabled: true
  max_iterations: 5
  builtin_tools:
  - get_current_time
  - http_get
  - read_file
  - write_file
  - list_directory
  - run_python
  - run_shell
  - json_parse
